name: Painel público
on:
  push:
    branches: [entrega/painel-publico-gediv, entrega/painel-completo-referencias]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribuicao:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar somente dependências de teste
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validar projeção pública sem bancos privados
        run: python -m unittest tests.test_publicacao_painel tests.test_distribuicao_publica -v
      - name: Verificar consulta, integração DOM e exportação XLSX
        run: npm test
      - name: Preparar distribuição estática permitida
        run: python scripts/preparar_painel_publico.py --projecao painel-publico/dados.json --saida dist
