name: Diagnóstico de leitura pública indireta
on:
  push:
    branches:
      - codex/sonda-leitura-publica-20261123
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Testar listagem e uma edição pública sem salvar dados
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, re, unicodedata, urllib.request

          base = "https://r.jina.ai/https://auniao.pb.gov.br"
          alvos = {
              "controle": "https://r.jina.ai/https://example.com",
              "listagem": base + "/doe",
              "pdf_publico": base + "/servicos/doe/2026/novembro/diario-oficial-20-11-2026-portal.pdf",
          }
          limite = 4 * 1024 * 1024
          def testar(item):
              nome, url = item
              resultado = {"alvo": nome, "ok": False}
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "GEDIV-diagnostico-publico/1.0", "Accept": "text/plain"})
                  with urllib.request.urlopen(req, timeout=80) as resposta:
                      dados = resposta.read(limite + 1)
                      resultado["http"] = resposta.status
                  if len(dados) > limite:
                      resultado["erro"] = "RESPOSTA_ACIMA_DO_LIMITE"
                      return resultado
                  texto = dados.decode("utf-8", errors="replace")
                  normal = "".join(c for c in unicodedata.normalize("NFKD", texto.lower()) if not unicodedata.combining(c))
                  resultado["bytes_texto"] = len(dados)
                  resultado["sha256_texto"] = hashlib.sha256(dados).hexdigest()
                  resultado["continha_diario_oficial"] = "diario oficial" in normal
                  if nome == "controle":
                      resultado["ok"] = resposta.status == 200 and "example domain" in normal
                  elif nome == "pdf_publico":
                      resultado["continha_numero_edicao"] = bool(re.search(r"18[.\\s,]*717", normal))
                      resultado["ok"] = resposta.status == 200 and len(dados) > 10000 and resultado["continha_diario_oficial"] and resultado["continha_numero_edicao"]
                  else:
                      resultado["continha_link_edicao"] = "diario-oficial-" in normal
                      resultado["ok"] = resposta.status == 200 and len(dados) > 1000 and resultado["continha_diario_oficial"] and resultado["continha_link_edicao"]
              except Exception as exc:
                  resultado["erro"] = type(exc).__name__
                  resultado["http"] = getattr(exc, "code", None)
              return resultado
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              resultados = list(pool.map(testar, alvos.items()))
          for item in resultados:
              print(json.dumps(item, ensure_ascii=True))
          print("Apenas diagnóstico: texto derivado de fonte pública, nenhum PDF ou conteúdo foi salvo.")
          raise SystemExit(0 if all(item["ok"] for item in resultados) else 1)
          PY
