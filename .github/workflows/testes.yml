name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas da leitura de PDF
        run: python -m pip install -r requirements-dev.txt
      - name: Testes automatizados (sem acesso à internet)
        run: python -m unittest discover -s tests -t . -v
